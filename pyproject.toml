[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiomatrix"
version = "0.1.0"
description = "Async Python framework for Telegram-like bot APIs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aiomatrix*"]
